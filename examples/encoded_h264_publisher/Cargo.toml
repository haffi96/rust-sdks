[package]
name = "encoded_h264_publisher"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["full"] }
livekit = { workspace = true, features = ["rustls-tls-native-roots"] }
libwebrtc = { workspace = true }
log = "0.4"
env_logger = "0.10.0"
clap = { version = "4.5", features = ["derive"] }
